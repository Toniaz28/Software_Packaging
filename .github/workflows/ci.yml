name: packaging-ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node - install, test, build, pack
        run: |
          npm install
          npm test
          npm run build
          npm run pack-artifact
      - name: Python - install deps and test
        run: |
          python -m pip install --upgrade pip
          pip install -r python-django-app/requirements.txt
          pip install --upgrade build
          pytest -q
      - name: Python - build wheel and sdist
        run: |
          pushd python-django-app
          python -m build --sdist --wheel -o dist
          popd
      - name: Java - test and package
        run: |
          mvn -f java-springboot-app/pom.xml test package -DskipTests=false
      - name: Generate checksums
        run: |
          python tools/checksums.py
      - name: Verify checksums
        run: |
          python tools/checksums.py --verify
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-artifacts
          path: |
            *.tgz
            java-springboot-app/target/*.jar
            python-django-app/dist/*
            artifacts/checksums.sha256
